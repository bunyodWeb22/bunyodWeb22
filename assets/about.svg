<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="I'm a developer from Uzbekistan who designs and ships Telegram bots, backend services and lightweight web apps, from idea to production deploy." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#141a27"/></linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#58a6ff" flood-opacity=".25"/></filter>
<clipPath id="c"><rect x="10" y="8" width="880" height="234" rx="18"/></clipPath>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern></defs>
<style>
.p{animation:rise linear infinite;opacity:0} @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-187px);opacity:0}}
.o1{animation:o1 11s ease-in-out infinite alternate} .o2{animation:o2 13s ease-in-out infinite alternate}
@keyframes o1{to{transform:translate(360px,30px)}} @keyframes o2{to{transform:translate(-380px,-20px)}}
.b{opacity:0;animation:in .8s ease-out forwards} @keyframes in{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
.dot{animation:dt 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center} @keyframes dt{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.7);opacity:.45}}
.bar{animation:bar 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top} @keyframes bar{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
.run{stroke-dasharray:160 1400;animation:rn 7s linear infinite} @keyframes rn{to{stroke-dashoffset:-1560}}
</style>
<g filter="url(#sh)"><rect x="10" y="8" width="880" height="234" rx="18" fill="url(#bg)"/></g>
<g clip-path="url(#c)"><rect x="10" y="8" width="880" height="234" fill="url(#grid)"/>
<circle class="o1" cx="120" cy="60" r="90" fill="#58a6ff" opacity=".28" filter="url(#blur)"/><circle class="o2" cx="720" cy="210" r="100" fill="#a371f7" opacity=".28" filter="url(#blur)"/>
