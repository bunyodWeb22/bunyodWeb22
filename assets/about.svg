<text x="48" y="52" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f0f6fc">I'm a developer from Uzbekistan who designs and ships Telegram bots,</text>
<text x="48" y="76" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f0f6fc">backend services and lightweight web apps, from idea to production deploy.</text>
<g class="b" style="animation-delay:0.3s"><circle class="dot" cx="48" cy="117" r="5" fill="#58a6ff" style="animation-delay:-0.0s"/><text x="66" y="122" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#c9d1d9">Building production Telegram bots: education, reminders, community management, media tools</text></g>
<g class="b" style="animation-delay:0.55s"><circle class="dot" cx="48" cy="149" r="5" fill="#a371f7" style="animation-delay:-0.5s"/><text x="66" y="154" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#c9d1d9">Integrating LLMs (Anthropic API) into real products: AI tutors and client-facing consultants</text></g>
<g class="b" style="animation-delay:0.8s"><circle class="dot" cx="48" cy="181" r="5" fill="#3fb950" style="animation-delay:-1.0s"/><text x="66" y="186" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#c9d1d9">Backend with Python, FastAPI, webhooks and SQLite, deployed on Render</text></g>
<g class="b" style="animation-delay:1.05s"><circle class="dot" cx="48" cy="213" r="5" fill="#f778ba" style="animation-delay:-1.5s"/><text x="66" y="218" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#c9d1d9">Open to freelance projects and collaboration</text></g>
