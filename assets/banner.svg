<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Bunyod - Frontend Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#151b28"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#58a6ff"><animate attributeName="stop-color" values="#58a6ff;#a371f7;#f778ba;#58a6ff" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#a371f7"><animate attributeName="stop-color" values="#a371f7;#f778ba;#58a6ff;#a371f7" dur="8s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
  <filter id="glow" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".6"/></filter>
  <clipPath id="type"><rect x="223" y="176" width="0" height="40"><animate attributeName="width" values="0;554;554;0;0" keyTimes="0;0.4;0.85;0.95;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="round"><rect width="1000" height="280" rx="16"/></clipPath>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
</defs>
<style>
  .p{animation:rise linear infinite;opacity:0}
  @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-230px);opacity:0}}
  .orb1{animation:o1 12s ease-in-out infinite alternate}
  .orb2{animation:o2 14s ease-in-out infinite alternate}
  @keyframes o1{from{transform:translate(0,0)}to{transform:translate(260px,40px)}}
  @keyframes o2{from{transform:translate(0,0)}to{transform:translate(-280px,-30px)}}
  .title{animation:pop 1.4s cubic-bezier(.2,.9,.3,1.2) both, pulse 4s ease-in-out 1.4s infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pop{from{opacity:0;transform:translateY(40px) scale(.7)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  .float{animation:fl 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .float2{animation:fl 4s ease-in-out -1.5s infinite;transform-box:fill-box;transform-origin:center}
  @keyframes fl{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
  .blink{animation:bl 1s steps(2) infinite}
  @keyframes bl{50%{opacity:0}}
  .ant{animation:ant 1.6s ease-in-out infinite}
  @keyframes ant{0%,100%{opacity:1}50%{opacity:.2}}
  .line{stroke-dasharray:60 1200;animation:dash 5s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-1260}}
.cr{opacity:0;animation:fall linear infinite}
  @keyframes fall{0%{transform:translateY(-30px);opacity:0}12%{opacity:.4}85%{opacity:.25}100%{transform:translateY(320px);opacity:0}}
</style>
<g clip-path="url(#round)">
  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="url(#grid)"/>
  <circle class="orb1" cx="200" cy="90" r="120" fill="#58a6ff" opacity=".35" filter="url(#blur)"/>
  <circle class="orb2" cx="760" cy="200" r="130" fill="#a371f7" opacity=".35" filter="url(#blur)"/>
  <circle class="p" cx="351" cy="199" r="3" fill="#58a6ff" style="animation-duration:5.3s;animation-delay:-3.9s"/>
  <circle class="p" cx="394" cy="254" r="1.5" fill="#58a6ff" style="animation-duration:5.9s;animation-delay:-5.5s"/>
  <circle class="p" cx="464" cy="233" r="1.5" fill="#58a6ff" style="animation-duration:7.2s;animation-delay:-1.4s"/>
  <circle class="p" cx="866" cy="252" r="1.5" fill="#58a6ff" style="animation-duration:7.5s;animation-delay:-5.7s"/>
  <circle class="p" cx="610" cy="254" r="3" fill="#a371f7" style="animation-duration:5.9s;animation-delay:-0.3s"/>
  <circle class="p" cx="316" cy="233" r="2" fill="#a371f7" style="animation-duration:7.3s;animation-delay:-3.2s"/>
  <circle class="p" cx="125" cy="254" r="2" fill="#58a6ff" style="animation-duration:7.2s;animation-delay:-2.2s"/>
  <circle class="p" cx="597" cy="187" r="2" fill="#3fb950" style="animation-duration:7.1s;animation-delay:-3.0s"/>
  <circle class="p" cx="496" cy="254" r="3" fill="#a371f7" style="animation-duration:6.0s;animation-delay:-2.2s"/>
  <circle class="p" cx="735" cy="211" r="1.5" fill="#3fb950" style="animation-duration:7.1s;animation-delay:-3.4s"/>
  <circle class="p" cx="766" cy="237" r="2.5" fill="#f778ba" style="animation-duration:5.3s;animation-delay:-3.7s"/>
  <circle class="p" cx="188" cy="223" r="2" fill="#58a6ff" style="animation-duration:6.7s;animation-delay:-5.6s"/>
  <circle class="p" cx="802" cy="251" r="2.5" fill="#f778ba" style="animation-duration:6.4s;animation-delay:-2.0s"/>
  <circle class="p" cx="613" cy="238" r="1.5" fill="#f778ba" style="animation-duration:8.8s;animation-delay:-5.0s"/>
  <circle class="p" cx="733" cy="265" r="1.5" fill="#f778ba" style="animation-duration:7.8s;animation-delay:-0.4s"/>
  <circle class="p" cx="311" cy="229" r="2.5" fill="#a371f7" style="animation-duration:6.8s;animation-delay:-0.1s"/>
  <g id="code-rain"><text class="cr" x="30" y="0" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#58a6ff" style="animation-duration:9.9s;animation-delay:-8.7s">html</text><text class="cr" x="92" y="0" font-family="'Courier New', Consolas, monospace" font-size="17" fill="#a371f7" style="animation-duration:7.0s;animation-delay:-2.3s">::</text><text class="cr" x="154" y="0" font-family="'Courier New', Consolas, monospace" font-size="17" fill="#a371f7" style="animation-duration:9.4s;animation-delay:-0.3s">&lt;/&gt;</text><text class="cr" x="216" y="0" font-family="'Courier New', Consolas, monospace" font-size="15" fill="#a371f7" style="animation-duration:8.3s;animation-delay:-3.9s">css</text><text class="cr" x="278" y="0" font-family="'Courier New', Consolas, monospace" font-size="15" fill="#3fb950" style="animation-duration:9.6s;animation-delay:-0.7s">css</text><text class="cr" x="340" y="0" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#a371f7" style="animation-duration:9.3s;animation-delay:-7.3s">=&gt;</text><text class="cr" x="402" y="0" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#58a6ff" style="animation-duration:9.0s;animation-delay:-3.3s">px</text><text class="cr" x="464" y="0" font-family="'Courier New', Consolas, monospace" font-size="17" fill="#a371f7" style="animation-duration:7.2s;animation-delay:-1.3s">js</text><text class="cr" x="526" y="0" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#3fb950" style="animation-duration:9.1s;animation-delay:-6.5s">div</text><text class="cr" x="588" y="0" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#58a6ff" style="animation-duration:8.5s;animation-delay:-7.1s">{}</text><text class="cr" x="650" y="0" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#3fb950" style="animation-duration:10.5s;animation-delay:-9.2s">flex</text><text class="cr" x="712" y="0" font-family="'Courier New', Consolas, monospace" font-size="15" fill="#58a6ff" style="animation-duration:7.0s;animation-delay:-1.4s">rem</text><text class="cr" x="774" y="0" font-family="'Courier New', Consolas, monospace" font-size="15" fill="#3fb950" style="animation-duration:10.1s;animation-delay:-0.6s">#</text><text class="cr" x="836" y="0" font-family="'Courier New', Consolas, monospace" font-size="17" fill="#3fb950" style="animation-duration:6.1s;animation-delay:-7.2s">#</text><text class="cr" x="898" y="0" font-family="'Courier New', Consolas, monospace" font-size="17" fill="#a371f7" style="animation-duration:8.4s;animation-delay:-5.4s">grid</text><text class="cr" x="960" y="0" font-family="'Courier New', Consolas, monospace" font-size="15" fill="#a371f7" style="animation-duration:9.2s;animation-delay:-6.4s">js</text></g>
  <text class="title" x="500" y="140" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="url(#name)" filter="url(#glow)">Bunyod</text>
  <g clip-path="url(#type)">
    <text x="223" y="204" textLength="554" lengthAdjust="spacingAndGlyphs" font-family="'Courier New', Consolas, monospace" font-size="22" fill="#c9d1d9">Frontend Developer | HTML, CSS, JS &amp; React</text>
  </g>
  <rect class="blink" width="3" height="26" y="180" fill="#58a6ff"><animate attributeName="x" values="240;770;770;240;240" keyTimes="0;0.4;0.85;0.95;1" dur="7s" repeatCount="indefinite"/></rect>
  <!-- code icon -->
  <g class="float" filter="url(#shadow)">
    <rect x="80" y="100" width="110" height="80" rx="14" fill="#161b22" stroke="#58a6ff" stroke-opacity=".7"/>
    <text x="135" y="152" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="34" font-weight="700" fill="#58a6ff">&lt;/&gt;</text>
  </g>
  <!-- bot icon -->
  <g class="float2" filter="url(#shadow)">
    <line x1="850" y1="88" x2="850" y2="108" stroke="#a371f7" stroke-width="3"/>
    <circle class="ant" cx="850" cy="84" r="6" fill="#f778ba"/>
    <rect x="805" y="108" width="90" height="70" rx="16" fill="#161b22" stroke="#a371f7" stroke-opacity=".8"/>
    <circle cx="833" cy="138" r="9" fill="#58a6ff"/><circle cx="867" cy="138" r="9" fill="#58a6ff"/>
    <circle cx="833" cy="138" r="3.5" fill="#0d1117"/><circle cx="867" cy="138" r="3.5" fill="#0d1117"/>
    <rect x="833" y="158" width="34" height="6" rx="3" fill="#3fb950"/>
  </g>
  <rect x="1" y="1" width="998" height="278" rx="15" fill="none" stroke="#58a6ff" stroke-opacity=".15"/>
  <rect class="line" x="1" y="1" width="998" height="278" rx="15" fill="none" stroke="#58a6ff" stroke-width="2" pathLength="1260"/>
</g>
</svg>