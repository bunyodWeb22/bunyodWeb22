<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-label="Have a project in mind? Let's build something amazing together." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#1f6feb"><animate attributeName="stop-color" values="#1f6feb;#8957e5;#db61a2;#1f6feb" dur="9s" repeatCount="indefinite"/></stop>
<stop offset="1" stop-color="#8957e5"><animate attributeName="stop-color" values="#8957e5;#db61a2;#1f6feb;#8957e5" dur="9s" repeatCount="indefinite"/></stop></linearGradient>
<filter id="sh" x="-10%" y="-30%" width="120%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#8957e5" flood-opacity=".5"/></filter></defs>
<style>.tw{animation:tw 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center} @keyframes tw{0%,100%{opacity:.1;transform:scale(.5)}50%{opacity:1;transform:scale(1.6)}}
.pz{animation:pz 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center} @keyframes pz{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.ar{animation:ar 1.4s ease-in-out infinite} @keyframes ar{0%{opacity:.15;transform:translateX(-10px)}50%{opacity:1}100%{opacity:.15;transform:translateX(10px)}}</style>
<g class="pz"><rect x="12" y="10" width="876" height="130" rx="24" fill="url(#g)" filter="url(#sh)"/>
<circle class="tw" cx="252" cy="102" r="2.5" fill="#fff" style="animation-delay:-2.7s"/><circle class="tw" cx="576" cy="92" r="1.5" fill="#fff" style="animation-delay:-2.9s"/><circle class="tw" cx="429" cy="41" r="2" fill="#fff" style="animation-delay:-2.8s"/><circle class="tw" cx="842" cy="61" r="1.5" fill="#fff" style="animation-delay:-2.7s"/><circle class="tw" cx="207" cy="93" r="2" fill="#fff" style="animation-delay:-1.8s"/><circle class="tw" cx="803" cy="63" r="2.5" fill="#fff" style="animation-delay:-2.2s"/><circle class="tw" cx="216" cy="83" r="2.5" fill="#fff" style="animation-delay:-2.6s"/><circle class="tw" cx="241" cy="43" r="2.5" fill="#fff" style="animation-delay:-1.7s"/><circle class="tw" cx="824" cy="72" r="2.5" fill="#fff" style="animation-delay:-2.3s"/><circle class="tw" cx="401" cy="25" r="1.5" fill="#fff" style="animation-delay:-1.2s"/><circle class="tw" cx="212" cy="60" r="2.5" fill="#fff" style="animation-delay:-2.0s"/><circle class="tw" cx="400" cy="88" r="1.5" fill="#fff" style="animation-delay:-3.0s"/><circle class="tw" cx="463" cy="89" r="1.5" fill="#fff" style="animation-delay:-3.0s"/><circle class="tw" cx="787" cy="41" r="2.5" fill="#fff" style="animation-delay:-0.3s"/><circle class="tw" cx="575" cy="81" r="2" fill="#fff" style="animation-delay:-2.7s"/><circle class="tw" cx="556" cy="52" r="1.5" fill="#fff" style="animation-delay:-0.5s"/><circle class="tw" cx="708" cy="69" r="2.5" fill="#fff" style="animation-delay:-1.9s"/><circle class="tw" cx="819" cy="78" r="1.5" fill="#fff" style="animation-delay:-2.0s"/><circle class="tw" cx="289" cy="38" r="2" fill="#fff" style="animation-delay:-2.5s"/><circle class="tw" cx="257" cy="77" r="2" fill="#fff" style="animation-delay:-0.8s"/><circle class="tw" cx="580" cy="124" r="2" fill="#fff" style="animation-delay:-0.6s"/><circle class="tw" cx="838" cy="120" r="2" fill="#fff" style="animation-delay:-1.8s"/><circle class="tw" cx="852" cy="53" r="2.5" fill="#fff" style="animation-delay:-0.4s"/><circle class="tw" cx="254" cy="35" r="2" fill="#fff" style="animation-delay:-0.4s"/>
<text x="60" y="65" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="#fff">Have a project in mind?</text>
<text x="60" y="102" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#ffffffdd">Telegram bots, AI integration and web apps. Let's build something amazing together.</text>
